name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the two-layer validator over the fixtures
        working-directory: schema
        run: python3 validate.py
      - name: Run the published plans
        working-directory: schema
        run: python3 validate.py published/*.json
      - name: Run the test suite
        run: |
          python3 -m pip install --quiet pytest markdown==3.7
          python3 -m pytest -q
      - name: Build the site and check the schema $id
        run: |
          python3 -m pip install --quiet markdown==3.7
          python3 site/build.py
      - name: Check the schema against draft 2020-12
        run: |
          python3 -m pip install --quiet "jsonschema>=4"
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("schema/requmexre.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          print("draft 2020-12 ok:", schema["$id"])
          PY
      - name: Validate CITATION.cff
        run: |
          python3 -m pip install --quiet cffconvert
          cffconvert --validate -i CITATION.cff
