name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the two-layer validator over the fixtures
        working-directory: schema
        run: python3 validate.py
      - name: Run the published plans
        working-directory: schema
        run: python3 validate.py published/*.json
