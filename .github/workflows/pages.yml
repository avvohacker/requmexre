name: pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - schema/RULES.md
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Markdown renderer
        run: python3 -m pip install --quiet markdown==3.7
      - name: Build the page
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
